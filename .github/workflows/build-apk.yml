name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./AndroidApp
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2
      
    - name: Build APK
      run: gradle assembleDebug > build_log.txt 2>&1
      
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: SnapTube-2.0-APK
        path: AndroidApp/app/build/outputs/apk/debug/app-debug.apk

    - name: Commit Logs on Failure
      if: failure()
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add build_log.txt
        git commit -m "Upload build log"
        git push
