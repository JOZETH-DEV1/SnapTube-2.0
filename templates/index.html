<!DOCTYPE html>
<html lang="es" class="dark">
<head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JozethDev Premium</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a0a0c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0a0a0c;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 80px;
            padding-top: env(safe-area-inset-top); 
        }
        .glass-header {
            background: rgba(10, 10, 12, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        /* ... existing styles ... */
        .search-bar {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .search-bar:focus-within {
            border-color: #f59e0b;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.15);
        }
        .video-card {
            background: linear-gradient(145deg, rgba(30, 30, 35, 0.8) 0%, rgba(15, 15, 18, 0.9) 100%);
            border: 2px solid rgba(255, 255, 255, 0.03);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .video-card:active { transform: scale(0.97); }
        .video-card.selected {
            border-color: #f59e0b;
            background: linear-gradient(145deg, rgba(245, 158, 11, 0.1) 0%, rgba(15, 15, 18, 0.95) 100%);
            transform: scale(1.02);
            box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.2);
        }
        .fab-gradient {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            box-shadow: 0 8px 30px -5px rgba(245, 158, 11, 0.5);
            color: #000;
        }
        .fab-gradient:active { transform: scale(0.95); }
        .check-circle { transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .selected .check-circle { transform: scale(1.1) rotate(360deg); }
        
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(245, 158, 11, 0.2);
            border-radius: 50%;
            border-top-color: #f59e0b;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .skeleton {
            background: linear-gradient(90deg, #1e1e24 25%, #2a2a32 50%, #1e1e24 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        .bottom-nav {
            background: rgba(15, 15, 18, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            color: #6b7280;
            transition: all 0.3s ease;
        }
        .nav-item.active {
            color: #f59e0b;
            transform: translateY(-2px);
        }

        .global-player {
            background: #1e1e24;
            border-top: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: translateY(100%);
        }
        .global-player.active {
            transform: translateY(0);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Ocultar scrollbar */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative">

    <header class="glass-header sticky top-0 z-40 px-4 pt-5 pb-4">
        <div class="max-w-3xl mx-auto">
            <div class="flex items-center justify-between mb-5">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-amber-500 flex items-center justify-center shadow-[0_0_15px_rgba(245,158,11,0.4)]">
                        <i class="fa-solid fa-play text-black text-lg ml-1"></i>
                    </div>
                    <h1 class="text-2xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-amber-300 to-amber-500">
                        JozethDev <span class="text-white">Premium</span>
                    </h1>
                </div>
            </div>

            <!-- Formulario principal de búsqueda -->
            <form id="search-form" class="relative group tab-search-only">
                <input type="text" id="search-input" placeholder="Buscar música o video..." 
                       class="search-bar w-full py-4 pl-14 pr-16 rounded-2xl text-white outline-none placeholder-gray-500 font-medium bg-[#15151a]">
                <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 transform -translate-y-1/2 text-gray-400 text-lg group-focus-within:text-amber-500 transition-colors"></i>
                <button type="submit" class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-amber-500 text-black rounded-xl p-2 w-12 h-10 flex items-center justify-center transition-all shadow-lg hover:bg-amber-400 active:scale-95">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </header>

    <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-4 mb-32 relative">
        
        <!-- VISTA DE BUSQUEDA (Player & Descargas) -->
        <div id="view-search" class="tab-content active">
            <div id="skeleton-container" class="hidden flex-col gap-4">
                <div class="flex gap-4 p-3 rounded-2xl border border-gray-800/50"><div class="w-36 h-24 rounded-xl skeleton"></div><div class="flex-1 py-2 space-y-4"><div class="h-4 skeleton rounded-full w-3/4"></div><div class="h-3 skeleton rounded-full w-1/2"></div></div></div>
                <div class="flex gap-4 p-3 rounded-2xl border border-gray-800/50"><div class="w-36 h-24 rounded-xl skeleton"></div><div class="flex-1 py-2 space-y-4"><div class="h-4 skeleton rounded-full w-4/5"></div><div class="h-3 skeleton rounded-full w-2/5"></div></div></div>
            </div>

            <div id="results" class="flex flex-col gap-4">
                <!-- Se inyecta dinámicamente -->
            </div>
        </div>

        <!-- VISTA DE PLAYLISTS -->
        <div id="view-playlists" class="tab-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-white">Tus Playlists</h2>
                <button onclick="openNewPlaylistModal()" class="bg-gray-800 hover:bg-gray-700 text-amber-500 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Nueva
                </button>
            </div>
            
            <div id="playlists-container" class="grid grid-cols-2 gap-4">
                <!-- Playlists renderizadas aqui -->
            </div>
            
            <!-- Vista interior de una playlist -->
            <div id="playlist-detail" class="hidden mt-6 bg-[#121215] p-4 rounded-3xl border border-gray-800">
                <div class="flex items-center gap-3 mb-6">
                    <button onclick="closePlaylistDetail()" class="w-10 h-10 bg-gray-800 rounded-full flex items-center justify-center text-white"><i class="fa-solid fa-arrow-left"></i></button>
                    <h3 id="playlist-detail-title" class="text-xl font-bold text-white truncate"></h3>
                    <button onclick="deleteCurrentPlaylist()" class="ml-auto text-rose-500 p-2"><i class="fa-solid fa-trash"></i></button>
                </div>
                <div id="playlist-detail-songs" class="flex flex-col gap-3">
                    <!-- Canciones -->
                </div>
            </div>
        </div>

    </main>

    <!-- Global Media Player -->
    <div id="global-player" class="global-player fixed bottom-[70px] left-0 right-0 z-40 flex flex-col items-center px-4 py-3 shadow-[0_-10px_40px_rgba(0,0,0,0.8)]">
        <div class="max-w-3xl w-full">
            <div id="video-wrapper" class="w-full aspect-video bg-black rounded-xl overflow-hidden hidden mb-3 border border-gray-700">
                <div id="native-video" class="w-full h-full pointer-events-auto"></div>
            </div>
            
            <div class="flex items-center gap-4">
                <img id="player-thumb" src="" class="w-14 h-14 rounded-lg object-cover shadow-lg border border-gray-700">
                <div class="flex-1 min-w-0">
                    <h4 id="player-title" class="font-bold text-sm text-white truncate">Título</h4>
                    <p id="player-channel" class="text-xs text-gray-400 truncate">Canal</p>
                </div>
                
                <button onclick="openAddToPlaylistModal(currentStreamVideo)" class="w-10 h-10 rounded-full bg-gray-800 text-gray-400 flex items-center justify-center transition hover:text-white">
                    <i class="fa-solid fa-list-ul"></i>
                </button>
                
                <button onclick="toggleVideoMode()" id="video-toggle-btn" class="w-10 h-10 rounded-full bg-gray-800 text-gray-400 flex items-center justify-center transition hover:text-white">
                    <i class="fa-solid fa-video"></i>
                </button>
                
                <audio id="native-audio" autoplay></audio>
                
                <button onclick="togglePlayPause()" id="play-pause-btn" class="w-12 h-12 rounded-full bg-amber-500 text-black flex items-center justify-center shadow-[0_0_15px_rgba(245,158,11,0.4)] transform transition active:scale-90">
                    <i class="fa-solid fa-play text-xl ml-1"></i>
                </button>
            </div>
            
            <div class="w-full h-1 bg-gray-700 mt-3 rounded-full overflow-hidden cursor-pointer" onclick="seekAudio(event)" id="audio-progress-container">
                <div id="audio-progress" class="h-full bg-amber-500 w-0 pointer-events-none transition-all duration-100"></div>
            </div>
        </div>
    </div>

    <!-- Modals Varios -->
    <div id="config-modal" class="fixed inset-0 z-[100] bg-black/90 hidden flex-col justify-end sm:justify-center items-center backdrop-blur-lg transition-all opacity-0 pointer-events-none">
        <div class="w-full sm:max-w-sm bg-[#121215] sm:rounded-3xl rounded-t-3xl p-6 border-t border-gray-800 transform translate-y-full transition-transform duration-300" id="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-white">Descarga Múltiple</h2>
                <button onclick="closeConfigModal()" class="w-8 h-8 bg-gray-800 rounded-full text-gray-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-4">
                <select id="dl-type" class="w-full bg-[#1a1a20] text-white rounded-xl p-4 border border-gray-800 font-bold" onchange="document.getElementById('quality-container').style.display = this.value === 'video' ? 'block' : 'none'">
                    <option value="audio">🎵 MP3 Audio</option>
                    <option value="video">🎥 MP4 Video</option>
                </select>
                <div id="quality-container" style="display:none;">
                    <select id="dl-quality" class="w-full bg-[#1a1a20] text-white rounded-xl p-4 border border-gray-800 font-bold">
                        <option value="1080">1080p</option>
                        <option value="720" selected>720p</option>
                    </select>
                </div>
            </div>
            <button onclick="confirmDownload()" class="w-full fab-gradient text-black font-extrabold py-4 px-4 rounded-xl mt-6">Iniciar Descarga</button>
        </div>
    </div>

    <div id="add-playlist-modal" class="fixed inset-0 z-[110] bg-black/90 hidden flex-col justify-end sm:justify-center items-center backdrop-blur-lg transition-all opacity-0 pointer-events-none">
        <div class="w-full sm:max-w-sm bg-[#121215] sm:rounded-3xl rounded-t-3xl p-6 border-t border-gray-800 transform translate-y-full transition-transform duration-300" id="playlist-modal-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-white">Guardar en Playlist</h2>
                <button onclick="closeAddPlaylistModal()" class="w-8 h-8 bg-gray-800 rounded-full text-gray-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div id="playlist-options" class="flex flex-col gap-3 max-h-60 overflow-y-auto mb-4">
                <!-- Se llenará dinámicamente -->
            </div>

            <div class="pt-4 border-t border-gray-800">
                <button onclick="openNewPlaylistModal()" class="w-full bg-gray-800 text-white font-bold py-4 px-4 rounded-xl flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus text-amber-500"></i> Crear Nueva Playlist
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav fixed bottom-0 left-0 right-0 z-50 px-6 py-3 flex justify-around items-center">
        <button onclick="switchTab('player')" id="tab-player" class="nav-item active flex flex-col items-center gap-1 w-20">
            <i class="fa-solid fa-play text-xl"></i>
            <span class="text-[10px] font-bold uppercase tracking-wider">Premium</span>
        </button>
        
        <!-- FAB Descargas -->
        <div class="-mt-8 relative">
            <button id="fab" onclick="openConfigModal()" class="fab-gradient w-14 h-14 rounded-full flex items-center justify-center transition-transform scale-0 shadow-lg">
                <i class="fa-solid fa-download text-xl"></i>
                <span id="fab-badge" class="absolute -top-1 -right-1 bg-rose-600 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-[#121215]">0</span>
            </button>
        </div>

        <button onclick="switchTab('download')" id="tab-download" class="nav-item flex flex-col items-center gap-1 w-20">
            <i class="fa-solid fa-folder-arrow-down text-xl"></i>
            <span class="text-[10px] font-bold uppercase tracking-wider">Bajar</span>
        </button>
        
        <button onclick="switchTab('playlists')" id="tab-playlists" class="nav-item flex flex-col items-center gap-1 w-20">
            <i class="fa-solid fa-list-music text-xl"></i>
            <span class="text-[10px] font-bold uppercase tracking-wider">Playlists</span>
        </button>
    </nav>

    <script>
        let allVideos = [];
        let activeDownloads = new Set();
        let selectedVideos = new Map(); 
        let currentMode = 'player'; 
        
        let playlistsData = {};
        let videoToAdd = null; 
        let currentQueue = [];
        
        let currentStreamVideo = null;
        let currentStreamId = null;
        let currentQueueIndex = -1;

        let prefetchedNextId = null;
        let prefetchedNextUrl = null;
        let isPrefetching = false;

        let isAudioOnlyMode = true;
        const audioEl = document.getElementById('native-audio');

        const videoEl = document.getElementById('native-video');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const input = document.getElementById('search-input');
        const resultsDiv = document.getElementById('results');
        const skeleton = document.getElementById('skeleton-container');
        const fab = document.getElementById('fab');

        // Fullscreen para iframe
        document.getElementById('native-video').ondblclick = () => {
            const el = document.getElementById('native-video');
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        };

        // INICIALIZACION
        async function loadPlaylists() {
            try {
                const res = await fetch('/api/playlists');
                playlistsData = await res.json();
                renderPlaylistsTab();
            } catch(e) {}
        }
        
        async function loadFYP() {
            skeleton.classList.remove('hidden');
            skeleton.classList.add('flex');
            resultsDiv.innerHTML = '';
            document.getElementById('search-input').value = '';
            try {
                const res = await fetch('/api/fyp');
                allVideos = await res.json();
                skeleton.classList.add('hidden');
                
                if(allVideos.length > 0) {
                    const title = document.createElement('h2');
                    title.className = "text-xl font-bold text-white mb-2 mt-2 flex items-center gap-2";
                    title.innerHTML = `<i class="fa-solid fa-fire text-amber-500"></i> Para Ti`;
                    resultsDiv.appendChild(title);
                    renderVideos(false); 
                } else {
                    resultsDiv.innerHTML = `<div class="text-center py-20 opacity-40"><i class="fa-solid fa-music text-5xl text-amber-500/50 mb-4"></i><h2 class="text-xl font-bold text-gray-300">¿Qué quieres escuchar?</h2></div>`;
                }
            } catch(e) {
                skeleton.classList.add('hidden');
            }
        }

        loadPlaylists();
        loadFYP();

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('tab-player').classList.toggle('active', mode === 'player');
            document.getElementById('tab-download').classList.toggle('active', mode === 'download');
            document.getElementById('tab-playlists').classList.toggle('active', mode === 'playlists');
            
            document.getElementById('view-search').classList.toggle('active', mode === 'player' || mode === 'download');
            document.getElementById('view-playlists').classList.toggle('active', mode === 'playlists');
            
            const searchForms = document.querySelectorAll('.tab-search-only');
            searchForms.forEach(f => f.style.display = mode === 'playlists' ? 'none' : 'block');
            
            if(mode === 'player' || mode === 'download') {
                if(allVideos.length === 0) loadFYP();
                else {
                    resultsDiv.innerHTML = '';
                    renderVideos();
                }
            } else {
                updateFab(); 
            }
        }

        document.getElementById('search-form').onsubmit = async (e) => {
            e.preventDefault();
            if(!input.value.trim()) {
                loadFYP();
                return;
            }
            resultsDiv.innerHTML = '';
            skeleton.classList.remove('hidden');
            skeleton.classList.add('flex');
            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(input.value.trim())}`);
                allVideos = await res.json();
                skeleton.classList.add('hidden');
                if(allVideos.length === 0) {
                    resultsDiv.innerHTML = `<div class="text-center py-20 text-gray-500 font-bold">Sin resultados</div>`;
                    return;
                }
                renderVideos();
            } catch(err) {
                skeleton.classList.add('hidden');
                resultsDiv.innerHTML = `<div class="text-center py-20 text-rose-500 font-bold">Error de red</div>`;
            }
        };

        function renderVideos(clearDiv = true) {
            if(currentMode === 'playlists') return;
            if(clearDiv) resultsDiv.innerHTML = '';
            const fragment = document.createDocumentFragment();

            allVideos.forEach(video => {
                const isSelected = selectedVideos.has(video.id);
                const isDownloading = activeDownloads.has(video.id);
                
                const card = document.createElement('div');
                card.id = `card-${video.id}`;
                let borderClass = isSelected ? 'border-amber-500 bg-amber-500/10' : 'border-gray-800/40';
                card.className = `video-card flex gap-4 p-3 rounded-2xl select-none relative ${borderClass}`;
                
                card.onclick = (e) => {
                    if(e.target.closest('.no-trigger')) return; 
                    if(currentMode === 'download') {
                        if(isDownloading) return;
                        toggleSelection(video.id, video.url);
                    } else {
                        startStreaming(video);
                    }
                };

                let actionUI = '';
                if(currentMode === 'download') {
                    actionUI = `
                    <div class="flex items-center justify-between mt-2">
                        <div id="status-${video.id}" class="text-xs font-bold text-amber-400 hidden"></div>
                        <div class="check-circle w-7 h-7 rounded-full border-2 ${isSelected ? 'border-amber-500 bg-amber-500 text-black' : 'border-gray-600 bg-gray-800 text-transparent'} flex items-center justify-center shadow-md ml-auto" id="check-${video.id}">
                            <i class="fa-solid fa-check text-xs"></i>
                        </div>
                    </div>`;
                } else {
                    actionUI = `
                    <div class="flex items-center justify-between mt-2">
                        <div class="text-xs font-bold text-amber-500"><i class="fa-solid fa-headphones"></i> Escuchar</div>
                        <button onclick="openAddToPlaylistModal(${JSON.stringify(video).replace(/"/g, '&quot;')})" class="no-trigger w-8 h-8 rounded-full bg-gray-800 text-gray-400 flex items-center justify-center hover:bg-gray-700 hover:text-white transition">
                            <i class="fa-solid fa-plus text-sm"></i>
                        </button>
                    </div>`;
                }

                card.innerHTML = `
                    <div class="relative w-36 h-24 flex-shrink-0 rounded-xl overflow-hidden bg-gray-900 border border-white/5">
                        <img src="https://i.ytimg.com/vi/${video.id}/mqdefault.jpg" class="w-full h-full object-cover">
                        <div class="absolute bottom-2 right-2 bg-black/80 text-amber-400 text-[10px] font-bold px-2 py-1 rounded-md">
                            ${Math.floor(video.duration/60)}:${(video.duration%60).toString().padStart(2,'0')}
                        </div>
                    </div>
                    <div class="flex flex-col justify-between py-1 w-full pr-1">
                        <div>
                            <h3 class="font-bold text-[13px] text-gray-100 leading-tight line-clamp-2">${video.title}</h3>
                            <p class="text-[11px] text-gray-400 mt-1">${video.channel}</p>
                        </div>
                        ${actionUI}
                    </div>
                    <div id="progress-container-${video.id}" class="hidden absolute bottom-0 left-0 right-0 h-1 bg-gray-900 rounded-b-2xl">
                        <div id="progress-bar-${video.id}" class="h-full bg-amber-500" style="width: 0%"></div>
                    </div>
                `;
                fragment.appendChild(card);
            });
            resultsDiv.appendChild(fragment);
        }

        function toggleSelection(id, url) {
            if(selectedVideos.has(id)) selectedVideos.delete(id);
            else selectedVideos.set(id, url);
            updateFab();
            renderVideos(); 
        }

        function updateFab() {
            if(selectedVideos.size > 0 && currentMode === 'download') {
                fab.classList.remove('scale-0');
                fab.classList.add('scale-100');
                document.getElementById('fab-badge').textContent = selectedVideos.size;
            } else {
                fab.classList.remove('scale-100');
                fab.classList.add('scale-0');
            }
        }

        function openAddToPlaylistModal(video) {
            videoToAdd = video;
            const container = document.getElementById('playlist-options');
            container.innerHTML = '';
            const pNames = Object.keys(playlistsData);
            if(pNames.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-sm text-center py-4">No tienes playlists creadas</p>`;
            } else {
                pNames.forEach(name => {
                    const btn = document.createElement('button');
                    btn.className = "w-full bg-[#1a1a20] hover:bg-gray-800 text-left px-4 py-3 rounded-xl text-white font-bold border border-gray-800 flex justify-between items-center transition";
                    btn.innerHTML = `<span>${name}</span> <span class="text-xs text-gray-500">${playlistsData[name].length}</span>`;
                    btn.onclick = () => addToPlaylist(name);
                    container.appendChild(btn);
                });
            }
            document.getElementById('add-playlist-modal').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('add-playlist-modal').classList.remove('opacity-0', 'pointer-events-none');
                document.getElementById('playlist-modal-content').classList.remove('translate-y-full');
            }, 10);
        }

        function closeAddPlaylistModal() {
            document.getElementById('add-playlist-modal').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('playlist-modal-content').classList.add('translate-y-full');
            setTimeout(() => document.getElementById('add-playlist-modal').classList.add('hidden'), 300);
        }

        async function openNewPlaylistModal() {
            const name = prompt("Nombre de la nueva Playlist:");
            if(!name || name.trim()==="") return;
            try {
                const res = await fetch('/api/playlists', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name: name.trim()})
                });
                playlistsData = await res.json();
                renderPlaylistsTab();
                if(videoToAdd) openAddToPlaylistModal(videoToAdd);
            } catch(e) { alert("Error creando playlist"); }
        }

        async function addToPlaylist(playlistName) {
            if(!videoToAdd) return;
            try {
                const res = await fetch(`/api/playlists/${playlistName}/add`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(videoToAdd)
                });
                playlistsData = await res.json();
                closeAddPlaylistModal();
                alert(`Guardado en ${playlistName}`);
                renderPlaylistsTab();
            } catch(e) { alert("Error"); }
        }

        function renderPlaylistsTab() {
            const container = document.getElementById('playlists-container');
            container.innerHTML = '';
            const pNames = Object.keys(playlistsData);
            if(pNames.length === 0) {
                container.innerHTML = `<div class="col-span-2 text-center py-20 text-gray-500">Crea tu primera playlist</div>`;
                return;
            }
            pNames.forEach(name => {
                const card = document.createElement('div');
                card.className = "bg-[#1a1a20] rounded-2xl p-4 border border-gray-800 cursor-pointer hover:border-amber-500 transition shadow-lg relative overflow-hidden group";
                const songs = playlistsData[name];
                let bgHTML = '';
                if (songs.length > 0) {
                    bgHTML = `<div class="absolute inset-0 opacity-20 group-hover:opacity-40 transition blur-[2px] bg-cover bg-center" style="background-image: url('https://i.ytimg.com/vi/${songs[0].id}/mqdefault.jpg')"></div>`;
                }
                card.onclick = () => openPlaylistDetail(name);
                card.innerHTML = `
                    ${bgHTML}
                    <div class="relative z-10 flex flex-col h-full justify-between min-h-[100px]">
                        <div class="w-10 h-10 bg-amber-500 rounded-xl flex items-center justify-center text-black mb-2 shadow-lg">
                            <i class="fa-solid fa-compact-disc text-xl"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-white text-lg truncate">${name}</h3>
                            <p class="text-xs text-gray-400 font-bold">${songs.length} pistas</p>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
        
        let currentDetailPlaylist = null;

        function openPlaylistDetail(name) {
            currentDetailPlaylist = name;
            document.getElementById('playlists-container').classList.add('hidden');
            const detail = document.getElementById('playlist-detail');
            detail.classList.remove('hidden');
            document.getElementById('playlist-detail-title').textContent = name;
            renderPlaylistSongs(name);
        }

        function closePlaylistDetail() {
            currentDetailPlaylist = null;
            document.getElementById('playlists-container').classList.remove('hidden');
            document.getElementById('playlist-detail').classList.add('hidden');
        }

        async function deleteCurrentPlaylist() {
            if(!currentDetailPlaylist || !confirm(`¿Borrar playlist ${currentDetailPlaylist}?`)) return;
            try {
                const res = await fetch(`/api/playlists/${currentDetailPlaylist}`, { method: 'DELETE' });
                playlistsData = await res.json();
                closePlaylistDetail();
                renderPlaylistsTab();
            } catch(e) {}
        }
        
        async function removeSongFromPlaylist(id, e) {
            e.stopPropagation();
            if(!currentDetailPlaylist) return;
            try {
                const res = await fetch(`/api/playlists/${currentDetailPlaylist}/remove`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id})
                });
                playlistsData = await res.json();
                renderPlaylistSongs(currentDetailPlaylist);
            } catch(e) {}
        }

        function renderPlaylistSongs(name) {
            const songsContainer = document.getElementById('playlist-detail-songs');
            songsContainer.innerHTML = '';
            const songs = playlistsData[name];
            if(!songs || songs.length === 0) {
                songsContainer.innerHTML = `<p class="text-gray-500 text-sm text-center py-4">Vacío</p>`;
                return;
            }
            songs.forEach(video => {
                const row = document.createElement('div');
                row.className = "flex items-center gap-3 p-2 bg-[#1a1a20] rounded-xl border border-gray-800 cursor-pointer hover:bg-gray-800 transition";
                row.onclick = () => startStreaming(video);
                row.innerHTML = `
                    <img src="https://i.ytimg.com/vi/${video.id}/default.jpg" class="w-12 h-12 rounded-lg object-cover">
                    <div class="flex-1 min-w-0">
                        <h4 class="text-sm font-bold text-white truncate">${video.title}</h4>
                        <p class="text-[10px] text-gray-400 truncate">${video.channel}</p>
                    </div>
                    <button onclick="removeSongFromPlaylist('${video.id}', event)" class="w-8 h-8 flex items-center justify-center text-gray-500 hover:text-rose-500 transition">
                        <i class="fa-solid fa-trash text-sm"></i>
                    </button>
                `;
                songsContainer.appendChild(row);
            });
        }

        let ytPlayer = null;
        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('native-video', {
                height: '100%',
                width: '100%',
                videoId: '',
                playerVars: { 'autoplay': 1, 'playsinline': 1, 'fs': 1, 'rel': 0 },
                events: {
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.ENDED) playNextSong();
                        else if (e.data === YT.PlayerState.PLAYING && !isAudioOnlyMode) playPauseBtn.innerHTML = `<i class="fa-solid fa-pause text-xl"></i>`;
                        else if (e.data === YT.PlayerState.PAUSED && !isAudioOnlyMode) playPauseBtn.innerHTML = `<i class="fa-solid fa-play text-xl ml-1"></i>`;
                    },
                    'onError': (e) => {
                        console.error('YT Iframe Error:', e.data);
                        document.getElementById('player-title').textContent = "⚠️ Video bloqueado. Cambiando a audio...";
                        if (!isAudioOnlyMode) {
                            toggleVideoMode(); // Switch back to audio mode where it works!
                        }
                    }
                }
            });
        }

        function startStreaming(video, updateQueue = true, queueIndex = -1) {
            currentStreamVideo = video;
            currentStreamId = video.id;
            
            if (updateQueue && currentMode === 'playlists' && currentDetailPlaylist) {
                currentQueue = [...playlistsData[currentDetailPlaylist]];
                currentQueueIndex = currentQueue.findIndex(v => v.id === video.id);
            } else if (!updateQueue) {
                currentQueueIndex = queueIndex;
            } else {
                currentQueueIndex = 0; // First song of new radio
            }

            fetch('/api/history', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(video) }).catch(console.error);

            const playerUI = document.getElementById('global-player');
            playerUI.classList.add('active');
            
            document.getElementById('player-title').textContent = "Cargando...";
            document.getElementById('player-channel').textContent = "Conectando...";
            document.getElementById('player-thumb').src = `https://i.ytimg.com/vi/${video.id}/default.jpg`;
            
            playPauseBtn.innerHTML = `<i class="fa-solid fa-spinner spin text-xl"></i>`;
            playPauseBtn.style.pointerEvents = 'none';

            if (updateQueue && currentMode === 'player') {
                currentQueue = [video]; 
                fetch(`/api/radio?channel=${encodeURIComponent(video.channel || video.title)}`)
                    .then(r => r.json())
                    .then(radioData => {
                        if(radioData && radioData.length > 0) {
                            const filtered = radioData.filter(v => v.id !== video.id);
                            currentQueue = [video, ...filtered];
                        }
                    }).catch(console.error);
            }

            if (isAudioOnlyMode) {
                if (ytPlayer && typeof ytPlayer.stopVideo === 'function') ytPlayer.stopVideo();
                
                document.getElementById('player-title').textContent = video.title;
                document.getElementById('player-channel').textContent = video.channel;
                
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: video.title,
                        artist: video.channel,
                        album: 'JozethDev Premium',
                        artwork: [{ src: `https://i.ytimg.com/vi/${video.id}/hqdefault.jpg`, sizes: '480x360', type: 'image/jpeg' }]
                    });
                    navigator.mediaSession.setActionHandler('nexttrack', playNextSong);
                    navigator.mediaSession.setActionHandler('previoustrack', playPreviousSong);
                    navigator.mediaSession.setActionHandler('play', togglePlayPause);
                    navigator.mediaSession.setActionHandler('pause', togglePlayPause);
                }
                
                audioEl.src = `/api/stream_direct?id=${video.id}&audio_only=true`;
                const playPromise = audioEl.play();
                if (playPromise !== undefined) {
                    playPromise.catch(e => {
                        console.error("Auto-play prevented", e);
                        document.getElementById('player-title').textContent = "Pausado (Toca Play para continuar)";
                        playPauseBtn.innerHTML = `<i class="fa-solid fa-play text-xl ml-1"></i>`;
                        playPauseBtn.style.pointerEvents = 'auto';
                    });
                }
            } else {
                audioEl.pause();
                document.getElementById('player-title').textContent = video.title;
                document.getElementById('player-channel').textContent = video.channel;
                if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
                    ytPlayer.loadVideoById(video.id);
                }
            }
        }

        
        function playNextSong() {
            if (!currentQueue || currentQueue.length === 0) return;
            let nextIndex = currentQueueIndex + 1;
            if (nextIndex > 0 && nextIndex < currentQueue.length) {
                startStreaming(currentQueue[nextIndex], false, nextIndex);
            } else {
                playPauseBtn.innerHTML = `<i class="fa-solid fa-play text-xl ml-1"></i>`;
            }
        }
        
        function playPreviousSong() {
            if (!currentQueue || currentQueue.length === 0) return;
            let prevIndex = currentQueueIndex - 1;
            if (prevIndex >= 0 && prevIndex < currentQueue.length) {
                startStreaming(currentQueue[prevIndex], false, prevIndex);
            }
        }

        function togglePlayPause() {
            if (isAudioOnlyMode) {
                if(audioEl.paused) { audioEl.play(); playPauseBtn.innerHTML = `<i class="fa-solid fa-pause text-xl"></i>`; }
                else { audioEl.pause(); playPauseBtn.innerHTML = `<i class="fa-solid fa-play text-xl ml-1"></i>`; }
            } else {
                if(ytPlayer && typeof ytPlayer.getPlayerState === 'function') {
                    const state = ytPlayer.getPlayerState();
                    if(state === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
                    else ytPlayer.playVideo();
                }
            }
        }

        function toggleFullscreen() {
            const iframe = document.getElementById('native-video');
            if (!iframe) return;
            if (iframe.requestFullscreen) iframe.requestFullscreen();
            else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
            else if (iframe.msRequestFullscreen) iframe.msRequestFullscreen();
        }

        function toggleVideoMode() {
            isAudioOnlyMode = !isAudioOnlyMode;
            const wrap = document.getElementById('video-wrapper');
            const btn = document.getElementById('video-toggle-btn');
            
            const fsBtn = document.getElementById('fullscreen-btn');
            if(!isAudioOnlyMode) {
                wrap.classList.remove('hidden');
                btn.classList.add('bg-amber-500', 'text-black');
                btn.classList.remove('bg-gray-800', 'text-gray-400');
                fsBtn.classList.remove('hidden');
            } else {
                wrap.classList.add('hidden');
                btn.classList.remove('bg-amber-500', 'text-black');
                btn.classList.add('bg-gray-800', 'text-gray-400');
                fsBtn.classList.add('hidden');
            }
            if(currentStreamId && currentStreamVideo) {
                startStreaming(currentStreamVideo, false);
            }
        }

        
        document.getElementById('progress-area').onclick = (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            if (isAudioOnlyMode) {
                if(audioEl.duration) audioEl.currentTime = pct * audioEl.duration;
            } else {
                if(ytPlayer && ytPlayer.getDuration) ytPlayer.seekTo(pct * ytPlayer.getDuration(), true);
            }
        };


                audioEl.onended = playNextSong;
        audioEl.onplaying = () => { if(isAudioOnlyMode) { playPauseBtn.innerHTML = `<i class="fa-solid fa-pause text-xl"></i>`; playPauseBtn.style.pointerEvents = 'auto'; if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing'; } };
        audioEl.onpause = () => { if(isAudioOnlyMode) { playPauseBtn.innerHTML = `<i class="fa-solid fa-play text-xl ml-1"></i>`; playPauseBtn.style.pointerEvents = 'auto'; if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused'; } };
        audioEl.onerror = () => { if(isAudioOnlyMode) playNextSong(); };
        audioEl.ontimeupdate = () => {
            if(audioEl.duration && isAudioOnlyMode) {
                const pct = (audioEl.currentTime / audioEl.duration) * 100;
                document.getElementById('audio-progress').style.width = pct + '%';
            }
        };



        
        setInterval(() => {
            if (!isAudioOnlyMode && ytPlayer && ytPlayer.getCurrentTime && ytPlayer.getDuration) {
                const dur = ytPlayer.getDuration();
                if (dur > 0) {
                    const pct = (ytPlayer.getCurrentTime() / dur) * 100;
                    document.getElementById('audio-progress').style.width = pct + '%';
                }
            }
        }, 1000);

        // DESCARGA
        function openConfigModal() { document.getElementById('config-modal').classList.remove('hidden'); setTimeout(() => { document.getElementById('config-modal').classList.remove('opacity-0', 'pointer-events-none'); document.getElementById('modal-content').classList.remove('translate-y-full'); }, 10); }
        function closeConfigModal() { document.getElementById('config-modal').classList.add('opacity-0', 'pointer-events-none'); document.getElementById('modal-content').classList.add('translate-y-full'); setTimeout(() => document.getElementById('config-modal').classList.add('hidden'), 300); }

        async function confirmDownload() {
            const dlType = document.getElementById('dl-type').value;
            const quality = document.getElementById('dl-quality').value;
            closeConfigModal(); 
            for (let [id, url] of selectedVideos.entries()) {
                const statusDiv = document.getElementById(`status-${id}`);
                const progCont = document.getElementById(`progress-container-${id}`);
                if (statusDiv) { statusDiv.classList.remove('hidden'); statusDiv.innerHTML = `Descargando...`; }
                if (progCont) progCont.classList.remove('hidden');
                try {
                    await fetch('/api/download', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id, url, type: dlType, quality})});
                    activeDownloads.add(id);
                } catch(e) {}
            }
            selectedVideos.clear();
            updateFab();
            pollProgress();
        }

        async function pollProgress() {
            if(activeDownloads.size === 0) return;
            try {
                const res = await fetch('/api/progress');
                const data = await res.json();
                for (let id of activeDownloads) {
                    if(data[id] !== undefined) {
                        const statusDiv = document.getElementById(`status-${id}`);
                        const progBar = document.getElementById(`progress-bar-${id}`);
                        if(data[id] === 100) {
                            if(statusDiv) statusDiv.innerHTML = `✅ ¡Listo!`;
                            if(progBar) progBar.style.width = `100%`;
                            activeDownloads.delete(id);
                        } else if(data[id] === -1) {
                            if(statusDiv) statusDiv.innerHTML = `❌ Error`;
                            activeDownloads.delete(id);
                        } else {
                            if(statusDiv) statusDiv.innerHTML = `${data[id].toFixed(1)}%`;
                            if(progBar) progBar.style.width = `${data[id]}%`;
                        }
                    }
                }
            } catch(e) {}
            if(activeDownloads.size > 0) setTimeout(pollProgress, 1000);
        }


        // YouTube API
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW Error:', err));
            });
        }
    </script>
</body>
